name: Scrape Telegram Channels

on:
  schedule:
    # Runs every 6 hours (at 0:00, 6:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  
  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Install dependencies
        run: npm install
      
      - name: Scrape tradingmasnael channel
        run: npm run scrape -- https://t.me/s/tradingmasnael
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      
      - name: Success
        if: success()
        run: echo "✅ Scraping complete"
      
      - name: Failure notification
        if: failure()
        run: echo "❌ Scraping failed"